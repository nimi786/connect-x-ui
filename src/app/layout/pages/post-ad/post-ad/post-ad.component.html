<form nz-form nzLayout="vertical" [formGroup]="addNewIncomeTransactionForm">
  <div class="supplier-main">
    <div nz-row class="category-details">
      <div class="box category-inner" nz-col nzMd="18">
        <div nz-row>
          <div nz-col nzMd="8" nzXs="24">
            <nz-form-item>
              <nz-form-label>Main Category</nz-form-label>
            </nz-form-item>
          </div>
          <!-- <div nz-col nzMd="2"></div> -->
          <div nz-col nzMd="16" nzXs="24">
            <nz-form-item>
              <nz-form-control>
                <nz-select formControlName="mainCategory" ngModel="lucy">
                  <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
                  <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div nz-row>
          <div nz-col nzMd="8" nzXs="24">
            <nz-form-item>
              <nz-form-label>Sub Category</nz-form-label>
            </nz-form-item>
          </div>
          <!-- <div nz-col nzMd="2"></div> -->
          <div nz-col nzMd="16" nzXs="24">
            <nz-form-item>
              <nz-form-control>
                <nz-select ngModel="lucy" formControlName="subCategory">
                  <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
                  <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div nz-row>
          <div nz-col nzMd="8" nzXs="24">
            <nz-form-item>
              <nz-form-label>Condition</nz-form-label>
            </nz-form-item>
          </div>
          <!-- <div nz-col nzMd="2"></div> -->
          <div nz-col nzMd="16" nzXs="24">
            <nz-form-item>
              <nz-form-control>
                <nz-select ngModel="lucy" formControlName="subCategory">
                  <nz-option nzValue="jack" nzLabel="Jack"></nz-option>
                  <nz-option nzValue="lucy" nzLabel="Lucy"></nz-option>
                  <nz-option
                    nzValue="disabled"
                    nzLabel="Disabled"
                    nzDisabled
                  ></nz-option>
                </nz-select>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div nz-row>
          <div nz-col nzMd="8" nzXs="24">
            <nz-form-item>
              <nz-form-label>Item Name</nz-form-label>
            </nz-form-item>
          </div>
          <!-- <div nz-col nzMd="2"></div> -->
          <div nz-col nzMd="16" nzXs="24">
            <nz-form-item>
              <nz-form-control>
                <input formControlName="itemName" nz-input />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div nz-row>
          <div nz-col nzMd="8" nzXs="24">
            <nz-form-item>
              <nz-form-label>Price (Rs.)</nz-form-label>
            </nz-form-item>
          </div>
          <!-- <div nz-col nzMd="2"></div> -->
          <div nz-col nzMd="16" nzXs="24">
            <nz-form-item>
              <nz-form-control>
                <input formControlName="" nz-input />
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>

        <div nz-row>
          <div nz-col nzMd="8" nzXs="24" class="form_label">
            <nz-form-item>
              <nz-form-label>Item Description</nz-form-label>
            </nz-form-item>
          </div>
          <div nz-col nzMd="16" nzXs="24">
            <nz-form-item>
              <nz-form-control>
                <textarea
                  nz-input
                  class="editable-div"
                  formControlName="itemDescription"
                  placeholder="Brand Model Feature or Specification"
                ></textarea>
              </nz-form-control>
            </nz-form-item>
          </div>
        </div>
      </div>

      <div nz-col nzMd="5" class="uploadimg">
        <div class="imggrp" (click)="uploadImage('Invoice', 'Add')">
          <div><img src="../../../../../assets/icons/upload.svg" alt="" /></div>
          <div class="drag"><span>Upload Image </span></div>
        </div>
      </div>
    </div>

    <div>
      <div class="checklist"></div>

      <div class="box">
        <div nz-row class="tille">
          <div nz-col nzMd="8" nzXs="22">
            <div class="tab-sub-title">
              <span>Contact Details</span>
            </div>
          </div>

          <div nz-col nzMd="3" nzXs="2">
            <div class="filter" (click)="isHideContact = !isHideContact">
              <span
                nz-icon
                [nzType]="isHideContact ? 'caret-up' : 'caret-down'"
                nzTheme="outline"
              ></span>
            </div>
          </div>
        </div>
        <div class="sub-content">
          <div nz-row>
            <div nz-col nzMd="7" nzXs="24">
              <nz-form-item>
                <nz-form-label>Contact Name</nz-form-label>
              </nz-form-item>
            </div>
            <div nz-col nzMd="17" nzXs="24">
              <nz-form-item>
                <nz-form-control>
                  <input formControlName="" nz-input />
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>

          <div nz-row>
            <div nz-col nzMd="7" nzXs="24">
              <nz-form-item>
                <nz-form-label>Mobile Number</nz-form-label>
              </nz-form-item>
            </div>
            <div nz-col nzMd="17" nzXs="24">
              <nz-form-item>
                <nz-form-control>
                  <input formControlName="" nz-input />
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
          <div nz-row>
            <div nz-col nzMd="7" nzXs="24">
              <nz-form-item>
                <nz-form-label>City/ Town</nz-form-label>
              </nz-form-item>
            </div>
            <div nz-col nzMd="17" nzXs="24">
              <nz-form-item>
                <nz-form-control>
                  <input formControlName="" nz-input />
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>

          <div nz-row>
            <div nz-col nzMd="7" nzXs="24">
              <nz-form-item>
                <nz-form-label>Email Address</nz-form-label>
              </nz-form-item>
            </div>
            <div nz-col nzMd="17" nzXs="24">
              <nz-form-item>
                <nz-form-control>
                  <input formControlName="" nz-input />
                </nz-form-control>
              </nz-form-item>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="btns">
    <button class="previous">Cancel</button>
    <button class="next" (click)="next()">Post Ad</button>
  </div>
</form>
